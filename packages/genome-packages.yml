provider: Genome
providerId: genome
description: >-
  First-party Genome client libraries, mobile SDKs and e-commerce plugins. Genome links the Java and
  PHP merchant clients from its own "Ready-to-go libraries" documentation page; the mobile SDKs,
  browser SDK and shop plugins are published from the company's own GitHub organisation
  (github.com/genome-eu) and its own CDN (pay.genome.eu). Versions and publish dates below were read
  from each registry's metadata endpoint on 2026-09-12.
note: >-
  Currency is the headline finding. The two client libraries Genome actively documents were both
  published 2025-11-25 and are still at 0.0.x. Everything else the company ships — the iOS and
  Android payment SDKs and every e-commerce plugin — was last released or pushed between 2019 and
  2022, four to seven years before the API surface they wrap (the Hosted Payment Page JWT flow, the
  Verification of Payee API and the SEPA Payout API all post-date them).
