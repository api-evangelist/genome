  dedicated_portal: false
  note: >-
    Genome has no trust portal in the Vanta/Drata sense — no document request flow, no subprocessor
    list, no live control status. What it has is better than a badge wall and worse than a portal: the
    two ISO certificates are published as downloadable PDFs that name the certifying body, the
    registration number and the validity window, so a buyer can verify them against the registrar
    without asking anyone.
