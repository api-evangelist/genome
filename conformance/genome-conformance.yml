provider: Genome
providerId: genome
description: >-
  Standards and regulatory regimes the Genome contracts and documentation actually declare, each with
  the exact page or document that states it. Genome is a European Electronic Money Institution, and
  most of what it conforms to is named inside the payload specification rather than on a marketing
  page — which is the useful kind of conformance: a TPP or an ERP that already speaks Berlin Group
  NextGenPSD2 or ISO 20022 pain.001 integrates with no bespoke connector.
domain_standards:
- id: berlin-group-nextgenpsd2
  name: Berlin Group NextGenPSD2 XS2A Framework
  conforms: true
  confidence: high
  evidence: >-
    "This API definition is based on the Implementation Guidelines of the Berlin Group PSD2 API. It is
    not a replacement in any sense. The main specification is (at the moment) always the Implementation
    Guidelines of the Berlin Group PSD2 API." Genome's PSD2 dedicated interface implements the Berlin
    Group resource shapes verbatim: /psd2/v1/consents with access/balances/transactions and
    recurringIndicator, frequencyPerDay, validUntil and combinedServiceIndicator; consentStatus and
    scaStatus state machines; HAL-style _links with self, startAuthorisation, status and scaRedirect;
    /psd2/v1/payments/sepa-credit-transfers; /psd2/v1/funds-confirmations.
  evidence_url: https://developers.genome.eu/psd2-api/
  surface: https://my.genome.eu/psd2/v1/
  note: This is the domain-standard signature for Genome's market — read from the contract, not a claim.
- id: psd2
  name: Revised Payment Services Directive (EU) 2015/2366 (PSD2)
  conforms: true
  confidence: high
  roles:
  - ASPSP (Genome, as the account-servicing institution)
  - serves registered AISPs and PISPs
  evidence: >-
    Genome operates a dedicated PSD2 interface open to registered TPPs free of charge, requires an
    eIDAS QWAC via the Tpp-Qwac-Certificate header, enforces Strong Customer Authentication with a
    second factor delivered to the account holder, and publishes continuous availability and
    performance metrics for the dedicated interface.
  evidence_url: https://developers.genome.eu/psd2-api/
- id: psd2-rts-sca-csc
  name: Commission Delegated Regulation (EU) 2018/389 (RTS on SCA and CSC)
  conforms: true
  confidence: medium
  evidence: >-
    QWAC-based TPP identification (Art. 34), SCA with a dynamic OTP factor (Art. 4), and a published
    availability/performance surface for the dedicated interface (Art. 32(4)) at
    https://apimetrics.genome.eu and https://status.genome.eu.
  evidence_url: https://apimetrics.genome.eu
- id: iso-20022-pain-001-001-03
  name: ISO 20022 CustomerCreditTransferInitiationV03 (pain.001.001.03)
  conforms: true
  confidence: high
  evidence: >-
    "To send SEPA mass transfer you have to create a credit transfer message based on definitions of
    elements of the message pain.001.001.03 (CustomerCreditTransferInitiationV03) of ISO20022 XML
    standard", with the literal namespace urn:iso:std:iso:20022:tech:xsd:pain.001.001.03 and the
    Group Header / Payment Information / Transaction Information structure.
  evidence_url: https://developers.genome.eu/specifications-for-batch-creation/
- id: iso-20022-external-code-set
  name: ISO 20022 External Code Set — ExternalOrganisationIdentification1Code
  conforms: true
  confidence: high
  evidence: >-
    The Verification of Payee request parameter payee_scheme_name_code is constrained to the ISO 20022
    External Organisation Identification code set — BANK, CBID, CHID, CINC, COID, CUST, DUNS, EMPL,
    GS1G, SREN, SRET, TXID, BDID, BOID — and the documentation names the code set explicitly.
  evidence_url: https://developers.genome.eu/verification-of-payee-api/
- id: verification-of-payee
  name: Verification of Payee (EPC VOP scheme / Instant Payments Regulation (EU) 2024/886)
  conforms: true
  confidence: high
  evidence: >-
    Genome exposes a dedicated VoP endpoint at https://api.genome.eu/api/mp/payee/verification whose
    response carries scheme "vop" and the four scheme-defined matching outcomes — match, close match,
    no match, no applicable — plus payee_suggested_name on a close match, which is the EPC VOP
    response model.
  evidence_url: https://developers.genome.eu/verification-of-payee-api/
- id: iso-17442-lei
  name: ISO 17442 Legal Entity Identifier
  conforms: true
  confidence: high
  evidence: >-
    payee_company_code is documented as an "alpha-numeric code based on the ISO 17442 Financial
    services — Legal entity identifier (LEI)".
  evidence_url: https://developers.genome.eu/verification-of-payee-api/
- id: sepa-sct-inst
  name: SEPA Credit Transfer and SEPA Instant Credit Transfer
  conforms: true
  confidence: high
  evidence: >-
    The SEPA Payout API takes receiver_iban / receiver_bic / transfer_description (140 chars, the SCT
    remittance-information limit); webhook transaction_type values include sepa_incoming and
    sepa_instant_incoming; the PSD2 payment product is sepa-credit-transfers.
  evidence_url: https://developers.genome.eu/sepa-payout-api/
- id: dora
  name: Digital Operational Resilience Act (EU) 2022/2554
  conforms: claimed
  confidence: medium
  evidence: >-
    "Our compliance efforts confirm our commitment to information security, privacy, and operational
