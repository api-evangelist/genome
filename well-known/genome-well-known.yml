note: >-
  NOTHING IS SERVED. Not one path returned a real document on any host, so no WellKnown or SecurityTxt
  pointer is wired into apis.yml — this file records an absence, not a presence. Two hosts
  (pay.genome.eu and my.genome.eu) answer HTTP 200 to every /.well-known/* path with the same
  single-page-app HTML shell; those are recorded as misses with status 200 and a shell note, because
  a 200 that returns HTML is not a document. Genome runs a PSD2 OAuth 2.0 authorisation surface at
  https://my.genome.eu/oauth2 (documented at https://developers.genome.eu/psd2-api/) but publishes no
  RFC 8414 /.well-known/oauth-authorization-server or OpenID Connect discovery document for it, so a
  TPP must read the base URLs out of prose.
