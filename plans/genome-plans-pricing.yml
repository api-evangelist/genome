specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Genome
providerId: genome
generated: '2026-09-12'
method: searched
source: https://genome.eu/low-risk-merchant-account-pricing/ + https://genome.eu/high-risk-merchant-account-pricing/
created: '2026-05-04'
modified: '2026-09-12'
tags:
- Finance
- Payments
- Pricing
description: >-
  Genome's published merchant pricing. Replaces a 2026-05-04 bulk-sweep scaffold that invented
  free/professional/enterprise tiers with request quotas — Genome sells none of those. It prices a
  regulated payments service by RISK CLASSIFICATION and per-transaction fee, and there is no API
  metering of any kind: no request quota, no rate tier, no overage. Every value below is read verbatim
  off the pricing page.
pricing_model: per-transaction, risk-classified
api_metered: false
api_metering_note: >-
  Nothing in Genome's pricing references API calls, requests or quotas. Access to the API comes with an
  approved merchant account; the money is charged on payments, not on calls. The PSD2 dedicated
  interface is free to registered AISPs and PISPs by regulation.
risk_classification:
  determined_by: Genome compliance team, following due diligence
  inputs: [industry, country of registration]
  note: If either the industry or the country is classified high risk, high-risk pricing applies.
  high_risk_industries:
  - affiliate marketing
  - betting/gambling (licensed and regulated)
  - brokers and agents (non-real estate)
  - consumer credit vendors (non-bank loans, regulated and licensed in the EU)
  - direct marketing
  - electronic money institutions (EMI)
  - holding companies / investment industry services
  - lead generation
  - lotteries (regulated and licensed in the EU)
  - marketing
  - payment service providers (PSP)
  - skill games, games of chance and video game arcades (regulated and licensed in the EU)
  - software as a service
  - subscription services
  - telemarketing
  - Forex and electronic currency trading (regulated and licensed in the EU/EEA and Seychelles)
  - traditional dating services
  high_risk_countries:
  - Costa Rica
  - Curacao
  - Gibraltar
  - Guadeloupe
  - Isle of Man
  - Liechtenstein
  - North Macedonia
  - Ukraine
  - United Arab Emirates
plans:
- id: genome-merchant-low-risk
  name: Low-risk merchant account
  type: usage-based
  url: https://genome.eu/low-risk-merchant-account-pricing/
  currency: EUR
  description: >-
    Applies when a business operates in a low-risk industry and is registered in a low-risk country.
  entries:
  - label: Merchant account application processing
    name: application_processing
    type: one-time
    price: '0.00'
    currency: EUR
  - label: Unlimited merchant accounts, each corporation
    name: merchant_accounts
    type: entitlement
    limit: -1
    price: '0.00'
    currency: EUR
  - label: Payment initiation fee (Open Banking)
    name: open_banking_payment_initiation
    type: per-transaction
    price: '0.30'
    currency: EUR
  - label: Payout to Genome account
    name: payout_internal
    type: per-transfer
    price: '0.00'
    currency: EUR
  elements:
  - name: Hosted Payment Page
  - name: Instant bank payments (Pay by Bank)
  - name: Settlements and instant payouts
  - name: Open Banking
  - name: Merchant analytics
- id: genome-merchant-high-risk
  name: High-risk merchant account
  type: usage-based
  url: https://genome.eu/high-risk-merchant-account-pricing/
  currency: EUR
  description: >-
    Applies when a business operates in a high-risk industry or is registered in a high-risk country.
  entries:
  - label: Merchant account application processing
    name: application_processing
    type: one-time
    price: '0.00'
    currency: EUR
  - label: Unlimited merchant accounts, each corporation
    name: merchant_accounts
    type: entitlement
    limit: -1
    price: '0.00'
    currency: EUR
  - label: Payment initiation fee (Open Banking)
    name: open_banking_payment_initiation
    type: per-transaction
    price: 0.55 EUR + 4%
    currency: EUR
    note: A flat fee plus an ad-valorem percentage; the percentage is the material difference from low risk.
  - label: Payout to Genome account
    name: payout_internal
    type: per-transfer
    price: '0.00'
    currency: EUR
  elements:
  - name: Hosted Payment Page
  - name: Instant bank payments (Pay by Bank)
  - name: Settlements and instant payouts
  - name: Open Banking
  - name: Merchant analytics
- id: genome-psd2-tpp
  name: PSD2 dedicated interface (AISP / PISP)
  type: free
  url: https://developers.genome.eu/psd2-api/
  currency: EUR
  description: >-
    "Our PSD2 API are free to use for all registered AISPs and PISPs." Access is by registration, not
    by purchase — a TPP contacts psd2@genome.eu with its authorisation.
  entries:
  - label: PSD2 API access
    name: psd2_access
    type: entitlement
    price: '0.00'
    currency: EUR
  elements:
  - name: Account Information Services (AIS)
  - name: Payment Initiation Services (PIS)
  - name: Confirmation of Funds (PIIS)
