provider: Genome
providerId: genome
format: proprietary-envelope
description: >-
  Genome's complete published response-code registry: 137 numeric codes covering every merchant API
  surface (Host-to-Host, Payout, SEPA Payout, Query on Demand, Verification of Payee and the
  reconciliation, auth and statistics services). Genome publishes this as one flat table; the
  `class` on each entry below is derived from the documented numeric banding, and the
  `on_unknown_check_status` flag is taken verbatim from Genome's own "Behavior on response codes"
  table.
envelope:
  note: >-
    Genome does NOT use HTTP status codes to signal application outcomes. Probed 2026-09-12: a
    malformed POST to https://api.genome.eu/api/pf/host-to-host returned HTTP 200 with
    {"status":"error","code":1004,"message":"Invalid request"}. An agent MUST read the envelope
    `code`, never the HTTP status. This is not RFC 9457 problem+json and carries no `type` URI.
  http_status_on_error: 200
  fields:
  - name: code
    type: integer
    description: The response code from the registry below. 0 is the only success value.
  - name: message
    type: string
    description: Human-readable message; Genome states it may be extended depending on the case.
  - name: status
    type: string
    description: Request-level status, e.g. error / pending / success.
  - name: session_id
    type: string
    description: Unique session id for the request. Also returned as `sessionid` on the Host-to-Host surface.
  - name: timestamp
    type: integer
    description: Unix timestamp of the response.
  - name: reference
    type: string
    description: Genome's transaction reference, present on transaction responses.
  response_headers_observed:
  - x-itc-rayid
  - x-itc-code
  - x-itc-api
  - x-itc-executiontype
  headers_note: >-
    Observed on a live unauthenticated probe 2026-09-12. x-itc-rayid is the per-request trace id and
    is the value to quote to Genome support; x-itc-code mirrors the envelope code. None of these
    headers is documented.
retry_semantics:
  note: >-
    Genome publishes an explicit disposition table. For the codes flagged
    `on_unknown_check_status: true` the transaction result is UNKNOWN and the merchant must issue a
    CHECK request rather than assume failure or retry the payment. Every other non-zero code is a
    DECLINE. This is the single most important rule for an autonomous caller: treating an unknown as
    a failure and retrying can double-charge a cardholder.
  unknown_action: Send a CHECK transaction request to resolve the true status.
  default_for_other_codes: decline
