description: >-
  The card-decline slice of Genome's response-code registry — the 3100-3199 issuer/acquirer band and
  the 3200-3299 anti-fraud band. These are the codes that mean "the money did not move and a human or
  agent has to decide what to do next", as distinct from the malformed-request and account-eligibility
  codes carried in errors/genome-error-codes.yml.
envelope_field: code
envelope_message_field: message
http_status_on_decline: 200
masking:
  note: >-
    Genome publishes the full decline text for every code, so nothing is masked at the API boundary —
    the merchant sees the real reason. That makes masking the MERCHANT's responsibility: codes such as
    3102 (card lost or stolen), 3127 (bank negative list), 3128 (fraud bank decline), 3200 and 3220
    (anti-fraud declines) must not be surfaced verbatim to a buyer, because doing so tells a
    card-tester exactly which card failed which control.
  safe_to_show_buyer:
  - 3101
  - 3104
  - 3105
  - 3107
  - 3123
  never_show_buyer:
  - 3102
  - 3119
  - 3120
  - 3127
  - 3128
  - 3200
  - 3201
  - 3220
  - 3221
unknown_outcome_note: >-
  Five decline-band codes are NOT declines — 3109, 3117, 3118, 3124 and 3125 leave the transaction in
  an UNKNOWN state and Genome's own behaviour table requires a CHECK request to resolve them. Retrying
  the payment instead of checking is how a cardholder gets charged twice.
