aid: genome
name: Genome
description: >-
  Genome, operated by UAB "Maneuver LT" of Vilnius, is an Electronic Money Institution licensed and
  supervised by the Bank of Lithuania. It runs multi-currency personal and business accounts, issues
  Visa cards, and sells a merchant payments stack that is documented as six public API surfaces: the
  Host-to-Host API for direct card processing (AUTH, AUTH3D, SALE, SALE3D, SETTLE, REFUND, VOID and
  CHECK), the Payout API for sending funds to cardholders, the SEPA Payout API, the Query on Demand
  reporting API, a Verification of Payee API returning the EPC scheme's match outcomes, and a Berlin
  Group NextGenPSD2 dedicated interface offered free of charge to registered AISPs and PISPs. Batch
  transfers are submitted as ISO 20022 pain.001.001.03. Outcomes are carried in a proprietary
  137-code response envelope rather than HTTP status codes, and Genome publishes no OpenAPI, AsyncAPI,
  MCP server or /.well-known/ document on any of its hosts.
