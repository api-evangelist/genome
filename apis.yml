  - type: ErrorCatalog
    url: errors/genome-error-codes.yml
- aid: genome:genome-host-to-host-api
  name: Genome Host-to-Host API
  description: >-
    Direct card processing. One endpoint dispatching eight transaction types — AUTH, AUTH3D, SALE,
    SALE3D, SETTLE, REFUND, VOID and CHECK — accepting form-encoded or JSON bodies.
  humanURL: https://developers.genome.eu/merchants/host-to-host-api/
  baseURL: https://api.genome.eu
  tags:
  - Host-to-Host
  - Card Processing
  properties:
  - type: OpenAPI
    url: openapi/genome-host-to-host-api-openapi.yml
  - type: Overlay
    url: overlays/genome-host-to-host-api-overlay.yaml
  - type: Documentation
    url: https://developers.genome.eu/merchants/host-to-host-api/
  - type: APIReference
    url: https://gateway.genome.eu/help/cc
- aid: genome:genome-payouts-api
  name: Genome Payouts API
  description: >-
    Send funds to cardholders using full card data or a tokenized card. The synchronous response is
    pending; the final status arrives on the merchant callback. No reversal operation exists.
  humanURL: https://developers.genome.eu/merchants/payout-api/
  baseURL: https://api.genome.eu
  tags:
  - Payouts
  properties:
  - type: OpenAPI
    url: openapi/genome-payouts-api-openapi.yml
  - type: Overlay
    url: overlays/genome-payouts-api-overlay.yaml
  - type: Documentation
    url: https://developers.genome.eu/merchants/payout-api/
- aid: genome:genome-sepa-payout-api
  name: Genome SEPA Payout API
  description: >-
    SEPA credit transfer payouts by IBAN, with a companion transaction-status surface. Amounts can be
    read including or excluding the SEPA payout fee. No OpenAPI is published for this surface.
  humanURL: https://developers.genome.eu/sepa-payout-api/
  baseURL: https://api.genome.eu
  tags:
  - Payouts
  - SEPA
  properties:
  - type: Documentation
    url: https://developers.genome.eu/sepa-payout-api/
- aid: genome:genome-query-on-demand-api
  name: Genome Query on Demand API
  description: >-
    Historical transaction and chargeback reporting over a required unix time window, paged by page
    and limit with a 1,000-record page ceiling. No OpenAPI is published for this surface.
  humanURL: https://developers.genome.eu/merchants/query-on-demand-api/
  baseURL: https://api.genome.eu
  tags:
  - Reporting
  - Reconciliation
  properties:
  - type: Documentation
    url: https://developers.genome.eu/merchants/query-on-demand-api/
- aid: genome:genome-verification-of-payee-api
  name: Genome Verification of Payee API
  description: >-
    Check a SEPA beneficiary's name or identifier against the account before sending a payment.
    Returns the EPC VOP scheme outcomes — match, close match, no match, no applicable — with a
    suggested payee name on a close match. No OpenAPI is published for this surface.
  humanURL: https://developers.genome.eu/verification-of-payee-api/
  baseURL: https://api.genome.eu
  tags:
  - SEPA
  - Verification of Payee
  - Fraud Prevention
  properties:
  - type: Documentation
    url: https://developers.genome.eu/verification-of-payee-api/
- aid: genome:genome-psd2-api
  name: Genome PSD2 API
  description: >-
    Berlin Group NextGenPSD2 dedicated interface. Account Information Services, Payment Initiation
    Services for SEPA credit transfers, and Confirmation of Funds, secured with OAuth 2.0, Strong
    Customer Authentication and an eIDAS QWAC. Free to registered AISPs and PISPs. No OpenAPI is
    published for this surface.
  humanURL: https://developers.genome.eu/psd2-api/
  baseURL: https://my.genome.eu/psd2/v1
  tags:
  - PSD2
  - Open Banking
  - Berlin Group
  properties:
  - type: Documentation
    url: https://developers.genome.eu/psd2-api/
  - type: Authentication
    url: authentication/genome-authentication.yml
- aid: genome:genome-hosted-payment-page
  name: Genome Hosted Payment Page
  description: >-
    Redirect checkout hosted by Genome, opened with an HS256 JWT signed with the SHA-256 digest of the
    payment page secret. Keeps card data out of merchant scope. Supports card and Pay by Bank.
  humanURL: https://developers.genome.eu/merchants/hosted-payment-page/
  baseURL: https://pay.genome.eu
  tags:
  - Hosted Payment Page
  - Checkout
  properties:
  - type: Documentation
    url: https://developers.genome.eu/merchants/hosted-payment-page/
  - type: Components
    url: components/genome-components.yml
