  - {platform: Magento 2, repo: https://github.com/genome-eu/magento-v2, last_push: '2021-10-27'}
  - {platform: Magento 1, repo: https://github.com/genome-eu/magento, last_push: '2019-07-08'}
  - {platform: PrestaShop, repo: https://github.com/genome-eu/prestashop, last_push: '2020-09-10'}
  - {platform: OpenCart, repo: https://github.com/genome-eu/opencart, last_push: '2020-09-10'}
  - {platform: OXID eShop, repo: https://github.com/genome-eu/oxid, last_push: '2020-09-10'}
  - {platform: Ecwid, repo: https://github.com/genome-eu/ecwid, last_push: '2021-10-27'}
  - {platform: Drupal Commerce, repo: https://github.com/genome-eu/drupal, last_push: '2019-07-08'}
